<!DOCTYPE html> 
<html lang="en">
<head> 
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Game</title> 
    <link rel="stylesheet" href="styles.css">
    <script src="script.js" defer></script> 
</head> 
<body> 
    <h1>Craps</h1>
    <div class = "content">
        <div class = "left">
            <div class = "point"></div>
            <div class = "main">
                <div class = "display" >0</div>
                <div class = "playBTT" onclick='Play()'>Play</div>
            </div>
            <div class = "message"></div>
            <div class = "stats">
                <h2>Stats:</h2>
                <div class = "statsDP">W: L: Proportion: </div>
            </div>
        </div>
        <div class = "left">
            <h3>Rules:</h3>
            <div class = "text1">Rolling a 7 or 11 is a win, while rolling a 2, 3, or 12 is a loss. </div>
            <div class = "text2">Everything else becomes the point and must be rolled again before 7. </div>
        </div>
    </div>
</body> 
</html>
